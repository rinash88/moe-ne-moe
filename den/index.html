<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Помощник на каждый день</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single phone-width column — day header, demo note, a feed of six scenario cards; each card opens a bottom sheet with its tools */
:root{
  --bg:#F0EEE9; --surface:#FBFAF7; --soft:#E8E4DD; --line:#DDD8CF;
  --ink:#1F1D1A; --ink2:#57534C; --mute:#8C877E;
  --accent:#1F1D1A; --accent-ink:#F7F5F0; --accent-soft:#E8E4DD;
  --lime:#7E8F72; --lime-ink:#FBFAF7; --ai:#9A6B53; --ai-soft:#F2E7DF; --ok:#4F6B45; --warn:#A5543A;
  color-scheme:light;
  --display:'Onest', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --body:'Onest', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --r:20px;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 120px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:4px}
.date{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:30px;line-height:1.08;letter-spacing:-.025em;text-wrap:balance}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.note b{color:var(--ink)}
.card-ico{flex:0 0 22px;height:22px;border-radius:7px;background:var(--lime);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--lime-ink)}
.feed{display:flex;flex-direction:column;gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);transition:transform .15s}

.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:0;background:none;color:var(--mute)}
.when{font-size:12px;font-weight:700;color:var(--mute)}
.card h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.big{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sub{font-size:14px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--ink2)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
.chip.card-src{background:#E3E8DC;color:#43553A}
.open{font-size:13px;font-weight:700;color:var(--accent)}
.dots{display:flex;gap:4px}.dots i{width:16px;height:16px;border-radius:5px;background:var(--soft)}.dots i.on{background:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(31,29,26,.38);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 6px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh-head h3{margin:4px 0 0;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;flex:0 0 34px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tool h4{margin:0;font-size:15px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.row span:last-child{font-weight:700;white-space:nowrap}
.aifx{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ai);font-weight:600;line-height:1.35}
.aifx::before{content:"ИИ";flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--ai-soft);color:var(--ai);margin-top:1px}
.src{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.src::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--lime)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.done{background:var(--soft);color:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;gap:6px}.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.limit{display:flex;align-items:baseline;gap:8px}
.flash{animation:flash .6s}
@keyframes flash{from{background:var(--accent-soft)}}
.chat{display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.35}
.msg.ai{background:var(--soft);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
/* voice */
.mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);display:grid;place-items:center;box-shadow:0 0 0 7px var(--accent-soft)}
.mic svg{width:26px;height:26px}
.mic.rec{animation:rec 1s ease-in-out infinite}
@keyframes rec{50%{box-shadow:0 0 0 14px var(--accent-soft)}}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10}
.vbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.vt{width:100%;background:var(--soft);border-radius:14px 14px 14px 4px;padding:10px 12px;text-align:left;font-size:14px}
.vres{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.vres div{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline;border-left:3px solid var(--k);padding:3px 0 3px 9px;font-size:14px;font-weight:700;animation:vin .3s both}
.vres b{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--k)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- цвет: у каждого сценария свой насыщенный блок ---- */
:root{--mark:#0E6B53}
.c-money  {--c:#0E6B53;--cfg:#FFFFFF;--cchip:rgba(255,255,255,.18)}
.c-habits {--c:#FF6A3D;--cfg:#1E0F08;--cchip:rgba(30,15,8,.12)}
.c-people {--c:#F6A9C2;--cfg:#3A0E22;--cchip:rgba(58,14,34,.10)}
.c-voice  {--c:#2F47E0;--cfg:#FFFFFF;--cchip:rgba(255,255,255,.18)}
.c-skill  {--c:#F6C445;--cfg:#2A1E00;--cchip:rgba(42,30,0,.10)}
.c-morning{--c:#9ED4F2;--cfg:#0A2A3E;--cchip:rgba(10,42,62,.10)}
body{background:#F0EEE9}
h1{font-size:44px;font-weight:700;letter-spacing:-.045em;line-height:1}
.card{background:var(--c);color:var(--cfg);border:0;padding:18px;gap:12px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 24px -14px rgba(0,0,0,.35)}
.card .tag,.card .when,.card .sub,.card .open{color:var(--cfg)}
.card .tag{opacity:.75;font-weight:700}.card .when{opacity:.75}.card .sub{opacity:.85}
.card h2{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.12}
.card .big{font-size:40px;font-weight:700}
.card .chip,.card .chip.ai{background:var(--cchip);color:var(--cfg)}
.card .chip.card-src{background:var(--cfg);color:var(--c)}
.card .dots i{background:var(--cchip)}.card .dots i.on{background:var(--cfg)}
.card .bar{background:var(--cchip)}.card .bar>i{background:var(--cfg)}
.card .open{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.card-ico{background:var(--mark);color:#fff}
.src::before{background:var(--mark)}
/* лист */
.sheet{padding-top:0}
.sh-top{background:var(--c);color:var(--cfg);margin:0 -16px;padding:10px 16px 18px;border-radius:24px 24px 0 0;display:flex;flex-direction:column}
.sh-top .grab{background:var(--cchip)}
.sh-top .tag{color:var(--cfg);opacity:.75;font-weight:700}
.sh-top h3{font-size:26px;font-weight:700;letter-spacing:-.03em}
.sh-top .x{background:var(--cchip);color:var(--cfg)}
.sheet .btn{background:var(--c);color:var(--cfg)}
.sheet .btn.ghost{background:var(--soft);color:var(--ink)}
.sheet .btn.done{background:var(--soft);color:var(--ok)}
.sheet .seg button.on{background:var(--c);border-color:var(--c);color:var(--cfg)}
.sheet .dots i.on,.sheet .bar>i{background:var(--c)}
.sheet .msg.me{background:var(--c);color:var(--cfg)}
.sheet .mic{background:var(--c);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 22%,transparent)}
.sheet .mic svg path{stroke:var(--cfg)}.sheet .mic svg rect{fill:var(--cfg)}
.aifx{color:var(--ink);font-weight:500}
.aifx::before{background:var(--c,var(--ink));color:var(--cfg,#fff)}
.mic.fab{background:#1F1D1A;box-shadow:0 0 0 7px rgba(31,29,26,.12),0 12px 28px -10px rgba(0,0,0,.5)}

/* ---- интерактив: ответы на карточках ---- */
.card{cursor:default}
.prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.segs{display:flex;gap:4px}.segs i{width:22px;height:8px;border-radius:99px;background:var(--line);transition:background .25s}
.segs i.on{background:var(--c)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{border:0;border-radius:14px;padding:12px 14px;background:var(--cchip);color:var(--cfg);font-weight:600;font-size:15px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt .ok{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:2px solid currentColor;opacity:.45;display:grid;place-items:center}
.opt .ok svg{opacity:0}
.opt.on{background:var(--cfg);color:var(--c)}
.opt.on .ok{opacity:1;background:var(--c);border-color:var(--c);color:var(--cfg)}.opt.on .ok svg{opacity:1}
.opt:focus-visible,.card .open:focus-visible{outline:2px solid var(--cfg);outline-offset:2px}
.res{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.res>div:not(.aiw){font-size:15px;font-weight:600;line-height:1.35;padding-left:12px;border-left:3px solid var(--cfg)}
.aiw{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35;opacity:.9}
.aiw b{flex:0 0 auto;font-size:10px;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--cfg);color:var(--c);margin-top:1px}
.card .open{all:unset;cursor:pointer;align-self:flex-start;font-size:13px;font-weight:700;color:var(--cfg);text-decoration:underline;text-underline-offset:3px;opacity:.85}

.pf{display:flex;flex-direction:column;gap:8px;background:var(--surface);color:var(--ink);border-radius:16px;padding:14px}
.pf-l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips label{cursor:pointer}.pchips input{position:absolute;opacity:0;pointer-events:none}
.pchips span{display:block;padding:8px 12px;border-radius:99px;background:var(--soft);font-weight:600;font-size:14px}
.pchips input:checked+span{background:var(--c);color:var(--cfg)}
.pchips input:focus-visible+span{outline:2px solid var(--c);outline-offset:2px}
.pin{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
.pck{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.pck input{accent-color:var(--c);width:18px;height:18px}
.pf-b{display:flex;gap:8px}
.pbtn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;background:var(--c);color:var(--cfg)}
.pbtn.ghost{background:var(--soft);color:var(--ink)}

.hook{display:flex;gap:12px;align-items:center}.hook .big{font-size:48px;flex:0 0 auto}.hook span:last-child{font-size:14px;font-weight:600;line-height:1.3}
.hsrc{font-size:11px;opacity:.7;margin-top:-6px}
.fchip{border:0;padding:8px 12px;border-radius:99px;background:var(--soft);font-weight:600;font-size:14px;color:var(--ink)}
.fchip.on{background:var(--c);color:var(--cfg)}

.rrow{display:flex;gap:8px}.rrow .pin{flex:1;min-width:0}
.lnk{border:0;background:none;padding:0;font-weight:700;font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.rk{display:flex;gap:12px;align-items:center}.rk-n{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}.rk span:last-child{font-size:14px;line-height:1.3;color:var(--ink2)}
.rbars{display:flex;gap:4px;align-items:flex-end;height:44px}.rbars i{flex:1;border-radius:4px 4px 2px 2px}
.rbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:-4px}
.tg{display:flex;flex-direction:column;gap:6px}
.tgo{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.tgo b{font-size:15px}.tgo span{font-size:12px;color:var(--ink2)}
.tgo.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset;background:color-mix(in srgb,var(--c) 14%,#fff)}
.steps{display:flex;flex-direction:column;gap:8px}
.steps>div{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);line-height:1.35}
.steps b{flex:0 0 24px;height:24px;border-radius:50%;background:var(--c);color:var(--cfg);display:grid;place-items:center;font-size:12px}
.steps strong{display:block;color:var(--ink);font-size:14px}
.aiw2{display:flex;gap:8px;font-size:13px;line-height:1.35;color:var(--ink)}.aiw2 b{flex:0 0 auto;font-size:10px;padding:2px 6px;border-radius:6px;background:var(--c);color:var(--cfg);height:fit-content;margin-top:1px}

.rmini{display:flex;gap:8px}.rmini .pin{flex:1;min-width:0;border:0}
.pg{display:flex;flex-direction:column;gap:6px}.pgr{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.tmr{align-self:center;border:1px dashed var(--line);background:transparent;color:var(--ink2);border-radius:99px;padding:10px 16px;font-weight:700;font-size:14px;margin-top:4px}

.left{text-align:center;font-size:14px;font-weight:600;color:var(--mute);padding:6px 0}
.final{background:#1F1D1A;color:#F7F5F0;border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:12px}
.final .date{color:#A9A398}
.final h2{margin:0;font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1.05}
.final ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.final li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
.final li i{flex:0 0 10px;height:10px;border-radius:3px;background:var(--c);margin-top:5px}
.final .sub{color:#C9C3B8}

.final .fsegs i,.done .fsegs i{background:var(--c)}
.fsegs{display:flex;gap:4px}.fsegs i{flex:1;height:8px;border-radius:99px}
.final ul,.done ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.final li,.done li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
.final li b,.done li b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.pk{flex:0 0 22px;height:22px;border-radius:50%;background:var(--c);color:var(--cfg);display:grid;place-items:center}
.done-scrim{position:fixed;inset:0;background:rgba(31,29,26,.55);z-index:30}
.done{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 32px));max-height:calc(100% - 40px);overflow-y:auto;background:#1F1D1A;color:#F7F5F0;border-radius:28px;padding:26px 20px 20px;display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.done .date{color:#A9A398}
.done h2{margin:0;font-size:36px;font-weight:700;letter-spacing:-.04em;line-height:1.02}
.done li{color:#EDE9E1}
.dbtn{background:#F7F5F0;color:#1F1D1A;margin-top:4px;padding:14px}
.burst{position:relative;width:72px;height:72px;margin-bottom:4px}
.burst span{position:absolute;inset:14px;border-radius:50%;background:#F7F5F0;color:#1F1D1A;display:grid;place-items:center}
.burst span svg{width:24px;height:24px}
.burst i{position:absolute;left:31px;top:31px;width:10px;height:10px;border-radius:3px;background:var(--c);animation:fly .7s .1s ease-out both;transform:rotate(var(--a)) translateY(-32px)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}}
@keyframes fly{from{transform:rotate(var(--a)) translateY(0);opacity:0}}
.final{gap:14px}

/* ---- колода ---- */
.deck{position:relative;display:grid}
.deck>*{grid-area:1/1}
.ghost{border-radius:var(--r);background:var(--c);transform:translateY(calc(var(--d)*10px)) scale(calc(1 - var(--d)*.04));opacity:calc(1 - var(--d)*.3);align-self:end;height:60px;box-shadow:0 10px 24px -14px rgba(0,0,0,.35)}
#topcard{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;z-index:2}
#topcard input{user-select:text}
.stamp{position:absolute;top:16px;padding:6px 12px;border-radius:10px;border:2px solid var(--cfg);color:var(--cfg);font-weight:700;font-size:14px;opacity:0;pointer-events:none;letter-spacing:.02em}
.stamp.in{right:16px;transform:rotate(6deg)}.stamp.sk{left:16px;transform:rotate(-6deg)}
.acts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px}
.act{border:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;flex:1;white-space:nowrap;border-radius:99px;font-weight:700;font-size:15px}
.act svg{width:18px;height:18px}
.act.sk{background:var(--soft);color:var(--ink)}.act.in{background:#1F1D1A;color:#F7F5F0}
.cnt{font-size:13px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.hint2{text-align:center;font-size:12px;color:var(--mute)}
.segs i.sk{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);outline:1px solid var(--line)}
.fsegs i.sk{opacity:.25}
.pk0{flex:0 0 22px;height:22px;border-radius:50%;border:2px dashed #6f6a62}
.skl{opacity:.7}
.lnk2{border:0;background:none;color:#C9C3B8;font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start;padding:0}
.app{padding-bottom:20px}
[hidden]{display:none!important}
.mic.fab{display:none}
.mic.act-mic{background:#1F1D1A;width:56px;height:56px;flex:0 0 56px;box-shadow:0 0 0 6px rgba(31,29,26,.10)!important}
</style>

<div class="app">
  <header>
    <div class="date" id="today">Сегодня</div>
    <h1 id="hl">Сегодня не повторится</h1>

    if(k==='skill'){K.open=!K.open;renderFeed();return}
    if(k==='lesson'){R.lessonToday=!R.lessonToday;R.lesson+=R.lessonToday?1:-1;renderFeed();return}
    if(k==='cushion'){R.cushToday=!R.cushToday;R.cush+=R.cushToday?8000:-8000;renderFeed();return}
  }
  if(id==='skill'){if(K.skill===k){K.skill=null;K.fmt.clear();set.clear()}else{K.skill=k;K.fmt=new Set(['tip']);set.clear();set.add(k)}renderFeed();rerender();return}
  had?set.delete(k):set.add(k);
  const on=!had;
  if(id==='money'){if(k==='protect')S.protectedOn=on;if(k==='piggy')S.piggyOn=on}
  if(id==='habits')S.habits[k][6]=on?1:0;
  renderFeed();
}

/* ---- лист ---- */
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim'),sheetIn=document.getElementById('sheetIn');
let cur=null,lastFocus=null;
function openSheet(id){cur=id;lastFocus=document.activeElement;const c=CARDS.find(x=>x.id===id);sheet.className='sheet c-'+id;
  sheetIn.innerHTML=`<div class="sh-top"><div class="grab"></div><div class="sh-head"><div><span class="tag">${c.tag}</span><h3 id="shTitle">${id==='skill'?(R.target?'Твой трек':'Заменит ли ИИ твою работу?'):(typeof c.title==='function'?c.title():c.title)}</h3></div><button class="x" data-act="close" aria-label="Закрыть">×</button></div></div>`+SHEETS[id]();
  sheet.hidden=false;scrim.hidden=false;sheet.scrollTop=0;sheetIn.querySelector('.x').focus();}
function closeSheet(){sheet.hidden=true;scrim.hidden=true;cur=null;renderFeed();lastFocus&&lastFocus.focus&&lastFocus.focus();}
function rerender(){if(cur){const st=sheet.scrollTop;openSheet(cur);sheet.scrollTop=st;}}

/* ---- голос ---- */
const SAID='Завтра до обеда отправить отчёт Лене, в субботу встреча с Аней — купить ей подарок тысячи на три, купить корм коту и отложить пять тысяч на отпуск';
const OUT=[['Дело','var(--accent)','Отчёт Лене — завтра до 13:00'],['Напоминание','var(--warn)','Встреча с Аней — суббота'],['Покупка','var(--ok)','Подарок Ане — до 3 000 ₽'],['Покупка','var(--ok)','Корм коту — в список, лимит учтёт'],['Копилка','#7E8F72','Отпуск — 5 000 ₽']];
let busy=false;
function voiceDemo(){if(busy)return;busy=true;const m=sheetIn.querySelector('.mic'),l=document.getElementById('vlab'),t=document.getElementById('vt'),r=document.getElementById('vres');
  r.innerHTML='';m.classList.add('rec');l.textContent='Слушаю…';t.hidden=false;let i=0;
  const iv=setInterval(()=>{i+=3;t.textContent='«'+SAID.slice(0,i)+(i>=SAID.length?'»':'');if(i>=SAID.length){clearInterval(iv);m.classList.remove('rec');l.textContent='ИИ разбирает…';
    setTimeout(()=>{l.textContent='Готово. Можно сказать ещё';r.innerHTML=OUT.map(([k,c,x],j)=>`<div style="--k:${c};animation-delay:${j*110}ms"><b>${k}</b><span>${x}</span></div>`).join('');busy=false},700)}},28);}

/* ---- события ---- */
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o){openSheet(o.dataset.open);return}
  if(e.target===scrim){closeSheet();return}
  const kp=e.target.closest('[data-skp]');if(kp){K.skill=kp.dataset.skp;K.mode=null;A.skill.clear();A.skill.add(K.skill);renderFeed();return}
  const km=e.target.closest('[data-skm]');if(km){K.mode=km.dataset.skm;renderFeed();return}
  const rp=e.target.closest('[data-rpop]');if(rp){R.occ=rp.dataset.rpop;R.q=O[R.occ].name;R.target=null;renderFeed();rerender();return}
  const rt=e.target.closest('[data-rtgt]');if(rt){R.target=R.target===rt.dataset.rtgt?null:rt.dataset.rtgt;renderFeed();rerender();return}
  if(e.target.closest('[data-rreset]')){R.occ=null;R.target=null;renderFeed();rerender();setTimeout(()=>{const i=document.getElementById('rq');i&&i.focus()},0);return}
  const fm=e.target.closest('[data-fmt]');if(fm){const f=fm.dataset.fmt;K.fmt.has(f)?K.fmt.delete(f):K.fmt.add(f);if(f==='train'&&K.fmt.has(f)&&SK[K.skill].train){renderFeed();rerender()}else{renderFeed();rerender()}return}
  const q=e.target.closest('[data-ans]');if(q){const [id,k]=q.dataset.ans.split(':');answer(id,k);return}
  const p=e.target.closest('[data-pct]');if(p){S.piggyPct=+p.dataset.pct;S.piggyOn=true;A.money.add('piggy');rerender();return}
  const b=e.target.closest('[data-buy]');if(b){S.spent+=+b.dataset.buy;rerender();const t=document.getElementById('limitTool');t&&t.classList.add('flash');return}
  const s=e.target.closest('[data-sub]');if(s){S.subs[s.dataset.sub]=true;rerender();return}
  const h=e.target.closest('[data-hab]');if(h){S.habits[h.dataset.hab][6]=1;A.habits.add(h.dataset.hab);rerender();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  ({close:closeSheet,protect:()=>{S.protectedOn=true;A.money.add('protect');rerender()},gift:()=>{S.giftSaved=Math.min(3000,S.giftSaved+1000);A.people.add('gift');rerender()},
    call:()=>{S.calls=true;A.people.add('call');rerender()},doctor:()=>{S.doctor=true;rerender()},mic:voiceDemo})[a.dataset.act]?.();
});
document.getElementById('tmr').addEventListener('click',()=>{DAY=DAY===1?2:1;for(const k in DEC)delete DEC[k];IDX=0;wasDone=false;R.lessonToday=false;R.cushToday=false;
  const dd=new Date();dd.setDate(dd.getDate()+DAY-1);document.getElementById('today').textContent=`${W[dd.getDay()]}, ${dd.getDate()} ${M[dd.getMonth()]}`;
  document.getElementById('tmr').textContent=DAY===1?'Показать завтра →':'← Вернуться в сегодня';renderFeed();window.scrollTo({top:0,behavior:'smooth'})});
document.getElementById('fab').addEventListener('click',()=>{A.voice.add('say');openSheet('voice');setTimeout(voiceDemo,250)});
document.addEventListener('submit',e=>{const rf=e.target.closest('.rform');if(rf){e.preventDefault();const q=rf.querySelector('input').value.trim();R.q=q;if(q.length<2){R.nf=true;renderFeed();return}R.nf=false;const m=match(q);R.occ=m.length?m[0]:makeCustom(q);R.target=null;R.form=false;renderFeed();rerender();return}const f=e.target.closest('.pf');if(!f)return;e.preventDefault();const fd=new FormData(f),t=f.dataset.form;
  const who=(fd.get('other')||'').trim()||fd.get('who');
  if(t==='bday'){if(!fd.get('date')){f.querySelector('[name=date]').focus();return}const g=!!fd.get('gift');P.list.push({name:who,date:fd.get('date'),gift:g});A.people.add('bday');if(g)S.gifts+=3000}
  if(t==='call'){P.call={who,freq:fd.get('freq')};A.people.add('call');S.calls=true}
  if(t==='doc'){P.doc={who,freq:fd.get('freq')};A.people.add('doc');S.doctor=true}
  P.form=null;renderFeed();});
document.addEventListener('click',e=>{if(e.target.closest('[data-cancel]')){P.form=null;renderFeed()}});
document.addEventListener('click',e=>{if(e.target.closest('[data-micbtn]')){A.voice.add('say');openSheet('voice');setTimeout(voiceDemo,250);return}const dc=e.target.closest('[data-dec]');if(dc){decide(dc.dataset.dec);return}if(e.target.closest('[data-again]')){for(const k in DEC)delete DEC[k];IDX=0;wasDone=false;renderFeed();return}if(e.target.closest('[data-close-done]')||e.target.id==='doneScrim')closeDone()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('done').hidden){closeDone();return}if(e.key==='Escape'&&cur)closeSheet()});
renderFeed();
</script>
